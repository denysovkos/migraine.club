<svg width="1280" height="340" viewBox="0 0 1280 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How it works: log an attack, understand the pattern, share with your doctor">
  <rect width="1280" height="340" rx="24" fill="#0B1220"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- card 1 -->
    <rect x="40" y="40" width="376" height="260" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <circle cx="84" cy="86" r="22" fill="#1D4ED8" fill-opacity="0.35"/>
    <text x="84" y="93" text-anchor="middle" fill="#93C5FD" font-size="20" font-weight="700">1</text>
    <text x="120" y="93" fill="#F8FAFC" font-size="24" font-weight="700">Log</text>
    <text x="64" y="140" fill="#94A3B8" font-size="17">Pain level and start time. That is all</text>
    <text x="64" y="164" fill="#94A3B8" font-size="17">an attack needs. Add the rest later.</text>
    <rect x="64" y="192" width="328" height="14" rx="7" fill="#1E293B"/>
    <rect x="64" y="192" width="197" height="14" rx="7" fill="#F87171"/>
    <text x="64" y="232" fill="#E2E8F0" font-size="15" font-weight="600">Pain 6 / 10 · started 09:20</text>
    <rect x="64" y="248" width="96" height="28" rx="14" fill="#1E293B"/>
    <text x="112" y="267" text-anchor="middle" fill="#CBD5E1" font-size="13">Nausea</text>
    <rect x="168" y="248" width="150" height="28" rx="14" fill="#1E293B"/>
    <text x="243" y="267" text-anchor="middle" fill="#CBD5E1" font-size="13">Light sensitivity</text>

    <!-- card 2 -->
    <rect x="452" y="40" width="376" height="260" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <circle cx="496" cy="86" r="22" fill="#6D28D9" fill-opacity="0.35"/>
    <text x="496" y="93" text-anchor="middle" fill="#C4B5FD" font-size="20" font-weight="700">2</text>
    <text x="532" y="93" fill="#F8FAFC" font-size="24" font-weight="700">Understand</text>
    <text x="476" y="140" fill="#94A3B8" font-size="17">Monthly migraine days, medication</text>
    <text x="476" y="164" fill="#94A3B8" font-size="17">days, weather and cycle context.</text>
    <g fill="#A78BFA">
      <rect x="476" y="236" width="30" height="40" rx="4"/>
      <rect x="518" y="214" width="30" height="62" rx="4"/>
      <rect x="560" y="246" width="30" height="30" rx="4"/>
      <rect x="602" y="196" width="30" height="80" rx="4"/>
      <rect x="644" y="226" width="30" height="50" rx="4"/>
      <rect x="686" y="252" width="30" height="24" rx="4"/>
      <rect x="728" y="240" width="30" height="36" rx="4"/>
      <rect x="770" y="258" width="30" height="18" rx="4"/>
    </g>

    <!-- card 3 -->
    <rect x="864" y="40" width="376" height="260" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <circle cx="908" cy="86" r="22" fill="#047857" fill-opacity="0.4"/>
    <text x="908" y="93" text-anchor="middle" fill="#6EE7B7" font-size="20" font-weight="700">3</text>
    <text x="944" y="93" fill="#F8FAFC" font-size="24" font-weight="700">Share</text>
    <text x="888" y="140" fill="#94A3B8" font-size="17">A clinician report and an expiring</text>
    <text x="888" y="164" fill="#94A3B8" font-size="17">link for the date range you choose.</text>
    <rect x="888" y="192" width="328" height="84" rx="12" fill="#111827" stroke="#1E293B"/>
    <text x="908" y="222" fill="#E2E8F0" font-size="15" font-weight="600">Clinician report · PDF</text>
    <text x="908" y="246" fill="#64748B" font-size="13">HIT-6 · MIDAS · MSQ · medication days</text>
    <rect x="1124" y="204" width="76" height="24" rx="12" fill="#047857" fill-opacity="0.35"/>
    <text x="1162" y="221" text-anchor="middle" fill="#6EE7B7" font-size="12" font-weight="600">30 days</text>
  </g>
</svg>
