<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Migraine Club — evidence-first migraine diary">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="line" x1="760" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="150" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>

  <!-- logo mark -->
  <circle cx="122" cy="118" r="38" stroke="#93C5FD" stroke-width="4"/>
  <path d="M125 98l-11 22h17l-10 22" stroke="#93C5FD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="180" y="112" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700">Migraine Club</text>
  <text x="182" y="146" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="1">MIGRENNITY</text>

  <text x="84" y="232" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="600">Evidence-first migraine diary</text>
  <text x="84" y="272" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21">Fast logging. Conservative insights. Doctor-ready sharing.</text>

  <!-- pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#BFDBFE">
    <rect x="84" y="312" width="136" height="38" rx="19" fill="#1E3A8A" fill-opacity="0.6" stroke="#3B82F6" stroke-opacity="0.5"/>
    <text x="152" y="337" text-anchor="middle">Privacy-first</text>
    <rect x="232" y="312" width="130" height="38" rx="19" fill="#1E3A8A" fill-opacity="0.6" stroke="#3B82F6" stroke-opacity="0.5"/>
    <text x="297" y="337" text-anchor="middle">No diagnosis</text>
    <rect x="374" y="312" width="144" height="38" rx="19" fill="#1E3A8A" fill-opacity="0.6" stroke="#3B82F6" stroke-opacity="0.5"/>
    <text x="446" y="337" text-anchor="middle">No predictions</text>
  </g>

  <!-- dashboard card -->
  <rect x="740" y="60" width="480" height="300" rx="20" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
  <text x="768" y="102" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600">Last 30 days</text>
  <text x="768" y="126" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">Migraine days · Weather Pain Index</text>
  <rect x="1104" y="82" width="92" height="30" rx="15" fill="#1D4ED8" fill-opacity="0.35"/>
  <text x="1150" y="102" text-anchor="middle" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">WPI 6 / 10</text>

  <path d="M768 290 L812 262 L856 276 L900 214 L944 238 L988 176 L1032 204 L1076 162 L1120 222 L1164 190 L1192 206 L1192 330 L768 330 Z" fill="url(#fill)"/>
  <path d="M768 290 L812 262 L856 276 L900 214 L944 238 L988 176 L1032 204 L1076 162 L1120 222 L1164 190 L1192 206" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#F87171">
    <circle cx="900" cy="214" r="6"/>
    <circle cx="988" cy="176" r="6"/>
    <circle cx="1076" cy="162" r="6"/>
    <circle cx="1164" cy="190" r="6"/>
  </g>
  <line x1="768" y1="330" x2="1192" y2="330" stroke="#1E293B" stroke-width="2"/>
</svg>
