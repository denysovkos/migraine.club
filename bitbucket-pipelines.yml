# Bitbucket Pipelines
#
# Runs on every pull request and on pushes to main.
#
# The verify step needs no secrets: vitest reads its env from `.vitest-env`
# (see vitest.config.mts), not from `.env`, so the suite runs green on a clean
# checkout.
#
# The build step does need the variables `src/libs/Env.ts` marks required, and
# `Env.ts` has no skipValidation escape. The placeholders below exist purely to
# get past that validation so compilation is checked.
#
# The artifact this step produces is NOT deployable: Next inlines NEXT_PUBLIC_*
# values into the client bundle at build time, so the bundle carries the
# placeholder keys. Nothing here uploads or deploys it — the step only answers
# "does it still compile".

image: node:22

definitions:
  caches:
    npmcache: ~/.npm

  steps:
    - step: &verify
        name: Lint, types and tests
        caches:
          - npmcache
        script:
          - npm ci
          - npm run lint
          - npm run check-types
          - npm run test -- --coverage
        artifacts:
          - coverage/**

    - step: &build
        name: Build
        caches:
          - npmcache
        script:
          # Each step runs in a fresh container, so node_modules does not carry
          # over from the verify step and the npm cache below only holds the
          # download cache. This install is required, not redundant.
          - npm ci
          # Placeholders only — see the note at the top of this file.
          - export CLERK_SECRET_KEY=sk_test_placeholder
          - export STRIPE_SECRET_KEY=sk_test_placeholder
          - export STRIPE_WEBHOOK_SECRET=whsec_placeholder
          - export BILLING_PLAN_ENV=test
          - export NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_placeholder
          - export NEXT_PUBLIC_CLERK_SIGN_IN_URL=/sign-in
          - export NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_placeholder
          - npm run build

pipelines:
  pull-requests:
    '**':
      - parallel:
          - step: *verify
          - step: *build

  branches:
    main:
      - parallel:
          - step: *verify
          - step: *build
