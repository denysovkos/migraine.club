# CI
#
# Runs on every pull request and on pushes to main.
#
# The repository is an npm workspace driven by Turborepo: the Go server
# (apps/server) serves the API and the Vite build of the frontend
# (apps/client), with the Playwright suite in apps/e2e and the shared
# packages in packages/.
#
# The verify job needs no secrets: vitest reads its env from `.vitest-env`
# (see apps/client/vitest.config.mts), not from `.env`, so the suite runs
# green on a clean checkout. The go job runs the Go tests against a throwaway Postgres.
#
# The build and e2e jobs need the variables the server and the frontend
# build read (apps/server/internal/config, apps/client/src/libs/Env.ts). The placeholders below exist
# purely so they start: NEXT_PUBLIC_* values are inlined into the frontend
# bundle at build time, so nothing built here is deployable or uploaded.
#
# The e2e job runs the Playwright suite against the production build (the Go
# binary serving apps/client/dist) with Clerk swapped for the mock in
# apps/client/src/libs/MockClerk.tsx (E2E_MOCK_AUTH, at build time and at runtime),
# backed by a throwaway Postgres service. No real Clerk or Stripe calls are
# made. A production build matters: the service worker (offline sync specs)
# only registers outside dev mode.
#
# The workflow name is load-bearing: release.yml triggers on the completion of
# the workflow called "CI".

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Everything but the Go server, which the go job covers.
      - name: Lint
        run: npm run lint:root && npx turbo run lint --filter='!@migraine/server'

      - name: Type check
        run: npx turbo run check-types

      - name: Unit tests
        run: npx turbo run test --filter='!@migraine/server'

      # Known vulnerabilities in what ships to users (the client bundle and
      # the server's npm-installed tooling are dev dependencies). Dev-only
      # tooling findings are left to the Dependabot updates.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: apps/client/coverage/
          if-no-files-found: ignore
          retention-days: 7

  go:
    name: Go lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The database-backed tests create a throwaway database per test from
    # TEST_DATABASE_URL (internal/testdb).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod

      # The code generators (make gen) run a few TypeScript helpers.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - name: Generated code is up to date
        run: npm run check-gen -w @migraine/server

      - name: gofmt
        run: test -z "$(gofmt -l apps/server)" || { gofmt -l apps/server; exit 1; }

      - name: Lint
        run: npm run lint -w @migraine/server

      - name: Tests
        run: npm run test -w @migraine/server

      # Known vulnerabilities in the Go modules and the standard library
      # that the server's code actually reaches.
      - name: govulncheck
        working-directory: apps/server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  build:
    name: Build
    runs-on: ubuntu-latest

    # Placeholders only — see the note at the top of this file.
    env:
      CLERK_SECRET_KEY: sk_test_placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      BILLING_PLAN_ENV: test
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod

      - run: npm ci

      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the production image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_placeholder
          --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_placeholder
          -t migraine-club:ci .

      # Render's persistent disk (FILES_STORAGE_PATH) is owned by root; a
      # non-root user could not write uploads there.
      - name: The image runs as root
        run: test "$(docker inspect -f '{{.Config.User}}' migraine-club:ci)" = "0" || test -z "$(docker inspect -f '{{.Config.User}}' migraine-club:ci)"

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Placeholders only, see the note at the top of this file. The mock-auth
    # flags must be present at build time (they swap the Clerk modules) and at
    # runtime (playwright.config.ts also sets them on the server).
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/e2e
      E2E_MOCK_AUTH: 'true'
      NEXT_PUBLIC_E2E_MOCK_AUTH: 'true'
      CLERK_SECRET_KEY: sk_test_placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      BILLING_PLAN_ENV: test
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build (mock auth)
        run: npm run build

      # The server applies migrations on boot (RUN_MIGRATIONS_ON_BOOT), and the
      # `seeded` fixture resets and seeds the e2e user before every test.
      - name: E2E tests
        run: npm run test:e2e -w @migraine/e2e -- --project=${{ matrix.browser }}

      - name: Upload traces and videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browser }}
          path: apps/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
